worker_processes auto;

events { worker_connections 1024; }

http {
  
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml+rss image/svg+xml;
  gzip_min_length 1024;

  # Tamanho de corpo (para uploads maiores, ajuste)
  client_max_body_size 20m;

  upstream frontend {
    server frontend:3000;
    keepalive 64;
  }

  upstream backend {
    server backend:3001;
    keepalive 64;
  }

  server {
    listen 80;

    # --- API ---
    location /api/ {
      proxy_pass         http://backend/;  # /api/foo -> http://backend/foo
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;   # WebSocket
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_read_timeout 300s;
    }

    # --- Healthcheck (opcional expor do front) ---
    location = /health {
      proxy_pass http://frontend/health;
    }

    # --- Frontend Next ---
    location / {
      proxy_pass         http://frontend/;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;   # SSR/WS
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host $host;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 300s;
    }
  }
}
