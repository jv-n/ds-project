version: "3.9"

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: repo-server
    env_file:
      - ./server/.env
    environment:
      - PORT=3001
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [appnet]

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: repo-client
    env_file:
      - ./client/.env
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_BASE=/api
    expose:
      - "3000"
    depends_on:
      server:
        condition: service_healthy
    networks: [appnet]

  nginx:
    image: nginx:1.27-alpine
    container_name: repo-proxy
    depends_on:
      - client
      - server
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    networks: [appnet]

networks:
  appnet:
    driver: bridge
