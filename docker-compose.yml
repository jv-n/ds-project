version: "3.9"

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: repo-server
    env_file:
      - ./server/.env
    environment:
      - PORT=3005
    expose:
      - "3005"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3005/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks: [appnet]

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: repo-client
    env_file:
      - ./client/.env
    environment:
      - PORT=5005
      - NEXT_PUBLIC_API_BASE=/api
    expose:
      - "5005"
    depends_on:
      server:
        condition: service_healthy
    networks: [appnet]

  # nginx:
  #   image: nginx:1.27-alpine
  #   volumes:
  #     - ./reverse-proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
  #   ports:
  #     - "80:80"
  #   depends_on:
  #     - client
  #     - server
  #   networks: [appnet]

networks:
  appnet:
    driver: bridge
