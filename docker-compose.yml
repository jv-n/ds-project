version: "3.9"

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: app-backend
    env_file:
      - ./server/.env
    environment:
      - PORT=3001
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - appnet

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: app-frontend
    env_file:
      - ./client/.env
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_BASE=/api
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - appnet

  nginx:
    image: nginx:1.27-alpine
    container_name: app-proxy
    depends_on:
      - frontend
      - backend
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      # Em produção, você pode publicar 443 e usar TLS com um conf extra
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
